[project]
name = "markitdown-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "markitdown>=0.1.8",
    "pdfminer-six",
    "pdfplumber",
    "mammoth",
    "python-pptx",
    "openpyxl",
    "pandas",
    "xlrd",
    "olefile",
    "youtube-transcript-api",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
    "pymupdf4llm>=1.28.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
