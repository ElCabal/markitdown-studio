name: Compilar MarkItDown Studio para Windows y Mac

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: MarkItDownStudio-Windows
            output_dir: dist/MarkItDownStudio
          - os: macos-latest
            artifact_name: MarkItDownStudio-macOS
            output_dir: dist/MarkItDownStudio

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv de Astral
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias completas
        run: |
          uv sync --all-extras

      - name: Compilar aplicacion en Windows
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed \
            --name "MarkItDownStudio" \
            --add-data "static;static" \
            --add-data "ejemplos;ejemplos" \
            --hidden-import "uvicorn" \
            --hidden-import "fastapi" \
            --hidden-import "markitdown" \
            --hidden-import "converter_engine" \
            --hidden-import "pymupdf" \
            --hidden-import "pymupdf4llm" \
            app.py

      - name: Compilar aplicacion en macOS
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed \
            --name "MarkItDownStudio" \
            --add-data "static:static" \
            --add-data "ejemplos:ejemplos" \
            --hidden-import "uvicorn" \
            --hidden-import "fastapi" \
            --hidden-import "markitdown" \
            --hidden-import "converter_engine" \
            --hidden-import "pymupdf" \
            --hidden-import "pymupdf4llm" \
            app.py

      - name: Subir artefacto compilado listo para compartir
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_dir }}
